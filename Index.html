<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leave Request Confirmation · MUIDS Residence</title>
<style>
  :root { --navy:#1F3A5F; --gold:#C9A227; --bg:#EEF2F7; --line:#E2E8F0; --mut:#64748B; --ok:#15803D; --no:#B91C1C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #1A202C; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .bar { height: 5px; background: var(--gold); }
  header { background: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header img { height: 40px; width: auto; max-width: 60%; }
  header .t { margin-left: auto; text-align: right; font-size: 12px; color: var(--mut); line-height: 1.35; }
  header .t b { color: var(--navy); letter-spacing: 1px; }
  .band { background: var(--navy); color: #fff; padding: 20px 16px; }
  .band .lbl { font-size: 11px; letter-spacing: 1.5px; color: var(--gold); font-weight: 700; }
  .band h1 { margin: 6px 0 0; font-size: 24px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .trip { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
  .trip .k { font-size: 11px; letter-spacing: 1.2px; color: var(--gold); font-weight: 700; }
  .trip .d { font-size: 17px; font-weight: 700; }
  .trip .h { font-size: 14px; color: #475569; }
  .arrow { color: #94A3B8; font-size: 22px; padding-top: 14px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  dt { color: var(--mut); font-size: 13px; } dd { margin: 0; font-weight: 600; font-size: 14px; word-break: break-word; }
  label { display: block; font-size: 13px; color: var(--mut); margin-bottom: 6px; }
  textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; resize: vertical; }
  button { width: 100%; padding: 14px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: .6; cursor: default; }
  .ok { background: var(--ok); color: #fff; border: 0; }
  .no { background: #fff; color: var(--no); border: 2px solid var(--no); }
  .link { background: none; border: 0; color: #475569; font-size: 14px; font-weight: 600; text-decoration: underline; }
  .chose { margin: 14px 0 0; }
  .center { text-align: center; } .big { font-size: 46px; line-height: 1; margin: 6px 0 10px; }
  .mut { color: var(--mut); font-size: 13px; }
  .hidden { display: none !important; }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--navy); border-radius: 50%; margin: 10px auto; animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  footer { text-align: center; font-size: 12px; color: #94A3B8; padding: 8px 16px 28px; }
  footer a { color: var(--navy); }
</style>
</head>
<body>
  <div class="bar"></div>
  <header>
    <img id="logo" alt="MUIDS">
    <div class="t"><b>MUIDS RESIDENCE</b><br>Student Leave Confirmation</div>
  </header>
  <div class="band"><div class="lbl" id="lbl">LEAVE REQUEST</div><h1 id="who">&nbsp;</h1></div>

  <main>
    <div id="loading" class="card center"><div class="spin"></div><div class="mut">Loading request…</div></div>

    <div id="error" class="card center hidden"><div class="big">⚠️</div><p id="errText"><b>Request not found</b><br><span class="mut">This link is invalid or has expired.</span></p></div>

    <div id="view" class="hidden">
      <div class="card">
        <div class="trip">
          <div><div class="k">LEAVING</div><div class="d" id="ld">-</div><div class="h" id="lt"></div></div>
          <div class="arrow">→</div>
          <div><div class="k">RETURNING</div><div class="d" id="rd">-</div><div class="h" id="rt"></div></div>
        </div>
        <dl id="more"></dl>
      </div>

      <div id="done" class="card center hidden"></div>

      <div id="form" class="card hidden">
        <label for="note">Note to the residence team (optional)</label>
        <textarea id="note" rows="2" maxlength="500"></textarea>
        <div id="choice"></div>
      </div>
    </div>
  </main>
  <footer id="foot"></footer>

<script src="config.js"></script>
<script>
  // settings live in config.js (shared with the parent and staff apps)
  const API_URL = window.APP_CONFIG.API_URL;
  const LOGO_URL = window.APP_CONFIG.LOGO_URL;
  const OFFICE_PHONE = window.APP_CONFIG.OFFICE_PHONE;

  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const T = (q.get('t') || '').replace(/[^a-f0-9]/gi, '');
  let PICK = (q.get('a') || '').toUpperCase();
  if (PICK !== 'OK' && PICK !== 'NO') PICK = '';

  if (LOGO_URL) { $('logo').onerror = () => $('logo').remove(); $('logo').src = LOGO_URL; } else $('logo').remove();
  if (OFFICE_PHONE) $('foot').innerHTML = 'Questions? Call the residence office: <a href="tel:' + OFFICE_PHONE.replace(/[^\d+]/g, '') + '">' + OFFICE_PHONE + '</a>';

  function show(id) { ['loading', 'error', 'view'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
  function fail(html) { if (html) $('errText').innerHTML = html; $('lbl').textContent = 'LEAVE REQUEST'; show('error'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function doneCard(approved, at) {
    $('form').classList.add('hidden');
    $('lbl').textContent = 'RESPONSE RECORDED';
    $('done').innerHTML = approved
      ? '<div class="big">✅</div><p><b>Recorded: Approved</b><br><span class="mut">Thank you for confirming this leave request.</span></p>'
      : '<div class="big">🛑</div><p><b>Recorded: Not approved</b><br><span class="mut">The residence team has been notified.</span></p>';
    if (at) $('done').innerHTML += '<p class="mut">' + esc(at) + '</p>';
    $('done').classList.remove('hidden');
  }

  function renderChoice() {
    const ok = '<button class="ok" onclick="send(\'OK\')">✓ ' + (PICK === 'OK' ? 'Confirm: Approve' : 'Approve') + '</button>';
    const no = '<button class="no" onclick="send(\'NO\')">✕ ' + (PICK === 'NO' ? 'Confirm: Do not approve' : 'Do not approve') + '</button>';
    $('choice').innerHTML =
      PICK === 'OK' ? '<p class="chose"><b>You chose: Approve.</b> Tap below to confirm.</p>' + ok +
                      '<button class="link" onclick="PICK=\'NO\';renderChoice()">Choose "Do not approve" instead</button>'
    : PICK === 'NO' ? '<p class="chose"><b>You chose: Do not approve.</b> Tap below to confirm.</p>' + no +
                      '<button class="link" onclick="PICK=\'OK\';renderChoice()">Choose "Approve" instead</button>'
    : ok + no;
  }

  async function load() {
    if (!T) return fail();
    if (/PASTE_YOUR/.test(API_URL)) return fail('<b>Setup needed</b><br><span class="mut">API_URL has not been set in config.js.</span>');
    try {
      const res = await fetch(API_URL + '?api=get&t=' + encodeURIComponent(T));
      const r = await res.json();
      if (!r.ok) return fail();
      $('who').textContent = r.name;
      $('lbl').textContent = r.pending ? (PICK ? 'PLEASE CONFIRM YOUR RESPONSE' : 'LEAVE REQUEST · ACTION REQUIRED') : 'RESPONSE RECORDED';
      const d = {}; (r.details || []).forEach(p => d[p[0]] = p[1]);
      $('ld').textContent = d['Date Leaving'] || '-'; $('lt').textContent = d['Time Leaving'] || '';
      $('rd').textContent = d['Return Date'] || '-'; $('rt').textContent = d['Return Time'] || '';
      const skip = ['Date Leaving', 'Time Leaving', 'Return Date', 'Return Time', 'Student ID'];
      const rows = (r.details || []).filter(p => skip.indexOf(p[0]) < 0);
      if (d['Student ID']) rows.unshift(['Student ID', d['Student ID']]);
      $('more').innerHTML = rows.map(p => '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>').join('');
      if (!rows.length) $('more').remove();
      show('view');
      if (r.pending && PICK) {
        // one tap from the email: record the chosen answer straight away
        $('done').innerHTML = '<div class="spin"></div><p class="mut">Recording your response…</p>';
        $('done').classList.remove('hidden');
        renderChoice(); send(PICK, true);
      } else if (r.pending) { renderChoice(); $('form').classList.remove('hidden'); }
      else doneCard(r.approved, r.respondedAt);
    } catch (e) {
      fail('<b>Could not load the request</b><br><span class="mut">Please check your connection and try again.</span>');
    }
  }

  async function send(a, auto) {
    if (!auto && a === 'NO' && PICK !== 'NO' && !confirm('Confirm that you do NOT approve this leave request?')) return;
    document.querySelectorAll('#choice button').forEach(b => b.disabled = true);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // simple request: no CORS preflight
        body: JSON.stringify({ api: 'respond', t: T, a: a, note: $('note').value })
      });
      const r = await res.json();
      if (!r.ok) throw new Error(r.error);
      doneCard(r.status === 'Approved' || r.status === 'Approved (phone)', r.at);
      $('done').innerHTML += '<p class="mut">A confirmation has been sent to your email and to the residence office.</p>';
    } catch (e) {
      $('done').classList.add('hidden'); $('form').classList.remove('hidden');
      alert('Something went wrong. Please tap the button again.');
      document.querySelectorAll('#choice button').forEach(b => b.disabled = false);
    }
  }

  load();
</script>
</body>
</html>
